<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HDFC Mutual Fund Facts FAQ</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1c1c1e;
      --muted: #5f6368;
      --line: #d9dbe0;
      --panel: #f6f7f9;
      --accent: #0b57d0;
      --accent-fg: #ffffff;
      --error: #b3261e;
      --chip: #eef1f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111315;
        --fg: #e8eaed;
        --muted: #a6acb5;
        --line: #33373d;
        --panel: #1a1d21;
        --accent: #8ab4f8;
        --accent-fg: #111315;
        --error: #f2b8b5;
        --chip: #24282e;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem 4rem;
    }
    .wrap { max-width: 40rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 .75rem; letter-spacing: -.01em; }
    .disclaimer {
      margin: 0 0 1.5rem;
      padding: .85rem 1rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .6rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .examples { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .example {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--fg);
      border-radius: 999px;
      padding: .45rem .8rem;
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
      text-align: left;
    }
    .example:hover { border-color: var(--accent); }
    .field { display: flex; gap: .5rem; }
    input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: .7rem .85rem;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: .55rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button[type="submit"] {
      flex: 0 0 auto;
      padding: .7rem 1.1rem;
      font: inherit;
      font-weight: 600;
      color: var(--accent-fg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: .55rem;
      cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: .6; cursor: progress; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .error {
      margin: 1rem 0 0;
      color: var(--error);
      font-size: .95rem;
    }
    .error a { color: inherit; }
    .answer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }
    .answer p { margin: 0 0 .6rem; }
    .source { color: var(--muted); font-size: .95rem; word-break: break-word; }
    .source a { color: var(--accent); }
    .updated { color: var(--muted); font-size: .85rem; }
    .trace { margin-top: 1.25rem; border-top: 1px solid var(--line); padding-top: .9rem; }
    .trace summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    .trace dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: .3rem .9rem;
      margin: 1rem 0;
      font-size: .88rem;
    }
    .trace dt { color: var(--muted); }
    .trace dd { margin: 0; word-break: break-word; }
    .trace ol { margin: 0; padding-left: 1.2rem; }
    .trace li { margin-bottom: 1rem; }
    .chunk-meta { margin: 0 0 .3rem; font-size: .85rem; color: var(--muted); }
    .chunk-meta strong { color: var(--fg); }
    .chunk-snippet {
      margin: 0 0 .3rem;
      padding: .55rem .7rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .45rem;
      font-size: .82rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chunk-url { font-size: .78rem; word-break: break-all; }
    .chunk-url a { color: var(--accent); }
    @media (max-width: 30rem) {
      .field { flex-direction: column; }
      button[type="submit"] { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Ask a factual question about HDFC mutual fund schemes.</h1>
    <p class="disclaimer">
      Facts-only. No investment advice. Answers are short quotations from official
      public pages, with one source link. This is not a recommendation to buy, sell,
      or hold any scheme.
    </p>

    <div class="examples" role="group" aria-label="Example questions">
      <button type="button" class="example"
        data-question="What is the expense ratio of HDFC Large Cap Fund Direct Growth?">
        What is the expense ratio of HDFC Large Cap Fund Direct Growth?
      </button>
      <button type="button" class="example"
        data-question="What is the lock-in for HDFC ELSS Tax Saver Fund?">
        What is the lock-in for HDFC ELSS Tax Saver Fund?
      </button>
      <button type="button" class="example"
        data-question="How do I download a capital-gains statement?">
        How do I download a capital-gains statement?
      </button>
    </div>

    <form id="ask-form" autocomplete="off">
      <label class="sr-only" for="question">Your question</label>
      <div class="field">
        <input id="question" name="question" type="text"
          placeholder="e.g. What is the exit load of HDFC Mid Cap Fund?">
        <button id="submit" type="submit">Ask</button>
      </div>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="answer" class="answer" aria-live="polite" hidden>
      <div id="sentences"></div>
      <p id="source-line" class="source"></p>
      <p id="updated" class="updated"></p>
    </section>

    <details id="trace" class="trace" hidden>
      <summary>How this answer was built</summary>
      <div id="trace-body"></div>
    </details>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("ask-form");
      var input = document.getElementById("question");
      var submit = document.getElementById("submit");
      var errorBox = document.getElementById("error");
      var answerBox = document.getElementById("answer");
      var sentencesBox = document.getElementById("sentences");
      var sourceLine = document.getElementById("source-line");
      var updated = document.getElementById("updated");
      var trace = document.getElementById("trace");
      var traceBody = document.getElementById("trace-body");

      document.querySelectorAll(".example").forEach(function (button) {
        button.addEventListener("click", function () {
          input.value = button.dataset.question || "";
          input.focus();
        });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        ask(input.value);
      });

      function setBusy(busy) {
        submit.disabled = busy;
        submit.textContent = busy ? "Asking…" : "Ask";
      }

      function clearError() {
        errorBox.hidden = true;
        errorBox.replaceChildren();
      }

      function showError(message, link) {
        errorBox.replaceChildren(document.createTextNode(message));
        if (link) {
          errorBox.appendChild(document.createTextNode(" "));
          var anchor = document.createElement("a");
          anchor.href = link;
          anchor.textContent = "View sources";
          errorBox.appendChild(anchor);
        }
        errorBox.hidden = false;
      }

      function clearAnswer() {
        sentencesBox.replaceChildren();
        sourceLine.replaceChildren();
        updated.textContent = "";
        traceBody.replaceChildren();
        trace.hidden = true;
        trace.open = false;
      }

      async function ask(raw) {
        var question = (raw || "").trim();
        clearError();
        if (!question) {
          showError("Enter a question.");
          return;
        }

        setBusy(true);
        try {
          var response = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question })
          });
          var data = await response.json().catch(function () { return {}; });

          if (!response.ok) {
            var message = (data.sentences && data.sentences[0]) ||
              data.detail || "I could not produce a sourced answer just now.";
            showError(message, data.sources_url || "/sources.csv");
            return;
          }

          render(data);
        } catch (error) {
          showError(
            "I could not reach the local app. Is python -m src.app running?",
            "/sources.csv"
          );
        } finally {
          setBusy(false);
        }
      }

      function render(data) {
        clearAnswer();

        var sentences = data.sentences || [];
        sentences.forEach(function (sentence) {
          var paragraph = document.createElement("p");
          paragraph.textContent = sentence;
          sentencesBox.appendChild(paragraph);
        });

        var source = data.source || {};
        if (source.url) {
          sourceLine.appendChild(document.createTextNode("Source: "));
          var anchor = document.createElement("a");
          anchor.href = source.url;
          anchor.target = "_blank";
          anchor.rel = "noreferrer";
          anchor.textContent = source.title || source.url;
          sourceLine.appendChild(anchor);
        }

        if (data.last_updated) {
          updated.textContent = "Last updated from sources: " + data.last_updated;
        }

        answerBox.hidden = false;
        renderTrace(data.trace);
      }

      function renderTrace(traceData) {
        traceBody.replaceChildren();
        if (!traceData) {
          trace.hidden = true;
          return;
        }

        var list = document.createElement("dl");
        addRow(list, "Route", traceData.route);
        addRow(list, "Reason", traceData.reason);
        addRow(list, "Embedding model", traceData.embedding_model);
        addRow(list, "LLM model", traceData.llm_model);
        traceBody.appendChild(list);

        var chunks = traceData.chunks || [];
        if (chunks.length) {
          var heading = document.createElement("p");
          heading.className = "chunk-meta";
          heading.textContent = "Retrieved chunks";
          traceBody.appendChild(heading);

          var ordered = document.createElement("ol");
          chunks.forEach(function (chunk) {
            ordered.appendChild(renderChunk(chunk));
          });
          traceBody.appendChild(ordered);
        }

        trace.hidden = false;
        trace.open = false;
      }

      function addRow(list, label, value) {
        var term = document.createElement("dt");
        term.textContent = label;
        var description = document.createElement("dd");
        description.textContent = value || "—";
        list.appendChild(term);
        list.appendChild(description);
      }

      function renderChunk(chunk) {
        var item = document.createElement("li");

        var meta = document.createElement("p");
        meta.className = "chunk-meta";
        var scheme = document.createElement("strong");
        scheme.textContent = chunk.scheme || "Unknown scheme";
        meta.appendChild(scheme);
        var similarity = typeof chunk.similarity === "number"
          ? chunk.similarity.toFixed(3)
          : "—";
        meta.appendChild(document.createTextNode(
          " · " + (chunk.section || "section") + " · similarity " + similarity
        ));
        item.appendChild(meta);

        var snippet = document.createElement("p");
        snippet.className = "chunk-snippet";
        snippet.textContent = chunk.snippet || "";
        item.appendChild(snippet);

        var urlLine = document.createElement("p");
        urlLine.className = "chunk-url";
        var anchor = document.createElement("a");
        anchor.href = chunk.source_url || "#";
        anchor.target = "_blank";
        anchor.rel = "noreferrer";
        anchor.textContent = chunk.source_url || "";
        urlLine.appendChild(anchor);
        item.appendChild(urlLine);

        return item;
      }
    })();
  </script>
</body>
</html>
